# Fork-only CI: compile touched packages and run board-owned tests only.
name: Board CI

on:
  push:
    branches:
      - "board/**"
  workflow_dispatch:
    inputs:
      tests:
        description: Space-separated board-owned test paths to run without the cache (empty = every board test without a cached pass)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: board-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-deps

      - name: Typecheck board core
        run: vp run --filter @t3tools/board-core typecheck

      - name: Typecheck server
        run: vp run --filter t3 typecheck

      - name: Typecheck web
        run: vp run --filter @t3tools/web typecheck

      # Per-file passes keyed by content (scripts/board-test.mjs); a run executes only unproven files.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/t3-board-tests
          key: board-tests-${{ github.sha }}
          restore-keys: board-tests-

      - name: Run board tests without a cached pass
        env:
          INPUT_TESTS: ${{ inputs.tests }}
        run: scripts/fork-sync.sh --ci
