# Fork-only CI: compile touched packages and run board-owned tests only.
name: Board CI

on:
  push:
    branches:
      - "board/**"
  workflow_dispatch:
    inputs:
      tests:
        description: Space-separated board-owned test paths to run without the cache (empty = every board test without a cached pass)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: board-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-deps

      - name: Check the fork boundary
        run: node scripts/fork-boundary.mjs

      - name: Lint board code with t3's rules
        run: vp lint --report-unused-disable-directives packages/board-core apps/server/src/board apps/web/src/board scripts/board-test.mjs scripts/fork-boundary.mjs

      # tsc build info is keyed by file content, so an unchanged package is skipped across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/t3-board-tsc
          key: board-tsc-${{ github.sha }}
          restore-keys: board-tsc-

      - name: Typecheck board core
        working-directory: packages/board-core
        run: vp exec tsc --noEmit --incremental --tsBuildInfoFile ~/.cache/t3-board-tsc/board-core.tsbuildinfo

      - name: Typecheck server
        working-directory: apps/server
        run: vp exec tsc --noEmit --incremental --tsBuildInfoFile ~/.cache/t3-board-tsc/server.tsbuildinfo

      - name: Typecheck web
        working-directory: apps/web
        run: vp exec tsc --noEmit --incremental --tsBuildInfoFile ~/.cache/t3-board-tsc/web.tsbuildinfo

      # Per-file passes keyed by content (scripts/board-test.mjs); a run executes only unproven files.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/t3-board-tests
          key: board-tests-${{ github.sha }}
          restore-keys: board-tests-

      - name: Run board tests without a cached pass
        env:
          INPUT_TESTS: ${{ inputs.tests }}
        run: scripts/fork-sync.sh --ci
