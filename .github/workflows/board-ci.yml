# Fork-only CI. Upstream workflows use Blacksmith runners and are disabled here.
# Runs web typecheck plus only the web unit tests changed on the branch (or the
# files passed to a manual run).
name: Board CI

on:
  push:
    branches:
      - "board/**"
  workflow_dispatch:
    inputs:
      tests:
        description: Space-separated test files under apps/web (empty = changed tests)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: board-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-deps

      - name: Typecheck web
        run: vp run --filter @t3tools/web typecheck

      - name: Select tests
        id: select
        env:
          INPUT_TESTS: ${{ inputs.tests }}
        run: |
          if test -n "$INPUT_TESTS"; then
            files="$INPUT_TESTS"
          else
            base="$(git merge-base origin/main HEAD)"
            files="$(git diff --name-only "$base" HEAD -- 'apps/web/src/**/*.test.ts' 'apps/web/src/**/*.test.tsx' \
              | grep -v '\.browser\.test\.' | sed 's#^apps/web/##' | tr '\n' ' ')"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Selected tests: ${files:-none}"

      - name: Run selected tests
        if: steps.select.outputs.files != ''
        working-directory: apps/web
        run: vp test run --project unit ${{ steps.select.outputs.files }}
